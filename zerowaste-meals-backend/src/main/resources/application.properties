spring.application.name=zerowaste-meals-backend

# MySQL (XAMPP default: root / empty password or 123_@Ankit)
# Override in production via environment variables.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:zerowaste_meals}?createDatabaseIfNotExist=true&useSSL=${DB_SSL:false}&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123_@Ankit}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# File uploads (food images, avatars)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=${UPLOAD_DIR:uploads}

# JWT - supply a strong secret via the JWT_SECRET environment variable in production
jwt.secret=${JWT_SECRET:zerowaste_meals_super_secret_key_2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

server.port=${SERVER_PORT:8080}