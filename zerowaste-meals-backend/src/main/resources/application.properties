spring.application.name=zerowaste-meals-backend
spring.config.import=optional:file:.env[.properties]

# PostgreSQL (Neon) - configured via the DATABASE_URL environment variable (.env)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# File uploads (food images, avatars)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=${UPLOAD_DIR:uploads}

# JWT - supply a strong secret via the JWT_SECRET environment variable in production.
# The built-in default is public knowledge, so the app refuses to start while it is still in use.
# To run locally with the default deliberately, set ALLOW_INSECURE_DEFAULT_JWT_SECRET=true.
jwt.secret=${JWT_SECRET:zerowaste_meals_super_secret_key_2026}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.security.allow-insecure-default-jwt-secret=${ALLOW_INSECURE_DEFAULT_JWT_SECRET:false}

# CORS - comma separated origins allowed to call the REST API.
# Defaults cover the local Vite dev servers and the deployed frontend, including its Vercel
# preview deployments (the prefix-scoped pattern matches only this project). Override in
# production only if the frontend moves, e.g.
#   CORS_ALLOWED_ORIGINS=https://your-app.vercel.app,http://localhost:5173
# Use "*" only to restore the previous allow-everything behaviour.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,https://zerowaste-meals-frontend-uxkzjtd5f-ankit-a65e.vercel.app,https://zerowaste-meals-frontend-uxkzjtd5f-ankit-a65e*.vercel.app}

# WebSocket (STOMP) - comma separated origins allowed to open the /ws socket.
# Defaults to any origin so localhost and the Vercel deployment both work out of the box;
# set WEBSOCKET_ALLOWED_ORIGINS in production to lock it down, e.g.
#   WEBSOCKET_ALLOWED_ORIGINS=https://your-app.vercel.app,http://localhost:5173
# The socket handshake carries no credentials of its own; access is gated by the JWT in the
# STOMP CONNECT frame, so a wide default here is far less severe than a wide REST CORS policy.
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:*}

server.port=${SERVER_PORT:8080}