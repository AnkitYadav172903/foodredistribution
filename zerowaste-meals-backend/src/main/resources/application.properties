spring.application.name=zerowaste-meals-backend
spring.config.import=optional:file:.env[.properties]

# PostgreSQL (Neon) - configured via the DATABASE_URL environment variable (.env)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# File uploads (food images, avatars)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=${UPLOAD_DIR:uploads}

# JWT - supply a strong secret via the JWT_SECRET environment variable in production
jwt.secret=${JWT_SECRET:zerowaste_meals_super_secret_key_2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

server.port=${SERVER_PORT:8080}